name: "guard presence: shell layer"

# Before 2026-10-23 the measured laptop ran each guard hook as a command string with no shell set, so Claude Code on
# Windows started it through Git Bash: bash.exe -c "python.exe guard.py", five times per tool call. The earlier arms
# launched the interpreter directly. This arm adds the bash layer, with Defender real-time protection on vs off.
# Rerun it yourself: fork, then Actions > "guard presence: shell layer" > Run workflow.
on:
  workflow_dispatch:
  push:
    paths: ["loadtest/summarize_layer.py", ".github/workflows/loadtest_layer.yml"]

permissions:
  contents: write

jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        av: [rtp-on, rtp-off]
        rep: [r1, r2, r3]
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set Defender real-time protection
        shell: pwsh
        run: |
          if ("${{ matrix.av }}" -eq "rtp-on") {
            try { Set-MpPreference -DisableRealtimeMonitoring $false -ErrorAction Stop } catch { "set failed: $_" | Tee-Object -FilePath av.txt -Append }
            $p = Get-MpPreference
            foreach ($x in @($p.ExclusionPath)) { if ($x) { try { Remove-MpPreference -ExclusionPath $x -ErrorAction Stop } catch {} } }
            foreach ($x in @($p.ExclusionProcess)) { if ($x) { try { Remove-MpPreference -ExclusionProcess $x -ErrorAction Stop } catch {} } }
            foreach ($x in @($p.ExclusionExtension)) { if ($x) { try { Remove-MpPreference -ExclusionExtension $x -ErrorAction Stop } catch {} } }
          } else {
            try { Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop } catch { "set failed: $_" | Tee-Object -FilePath av.txt -Append }
          }
          Start-Sleep -Seconds 5
          $s = Get-MpComputerStatus
          "RTP=$($s.RealTimeProtectionEnabled) AMService=$($s.AMServiceEnabled) Antivirus=$($s.AntivirusEnabled) Tamper=$($s.IsTamperProtected) Engine=$($s.AMEngineVersion)" | Tee-Object -FilePath av.txt -Append
          "bash=$((Get-Item 'C:\Program Files\Git\bin\bash.exe').VersionInfo.ProductVersion)" | Tee-Object -FilePath av.txt -Append
          "RU_EFF=eff-$($s.RealTimeProtectionEnabled)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Sweep both forms through bash.exe
        shell: bash
        env:
          RU_LAYER: bash
          RU_BASH: 'C:\Program Files\Git\bin\bash.exe'
        run: |
          export RU_LABEL="windows-2025/normal/${{ matrix.rep }}/${{ matrix.av }}/${RU_EFF}/bash"
          echo "label $RU_LABEL"
          python loadtest/sim.py per-call 45 1,4,8,12,16,24 out.jsonl
          python loadtest/sim.py one-process 45 1,4,8,12,16,24 out.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layer-${{ matrix.av }}-${{ matrix.rep }}
          path: |
            out.jsonl
            av.txt
          if-no-files-found: ignore

  summarize:
    needs: sweep
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Combine and apply the registered gate
        shell: bash
        run: |
          cat art/*/out.jsonl > combined.jsonl
          for d in art/*/; do echo "== $d"; cat "$d/av.txt" 2>/dev/null || true; done > hosts.txt
          python loadtest/summarize_layer.py combined.jsonl summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to the loadtest-results branch
        shell: bash
        run: |
          dest="results/layer-run-${GITHUB_RUN_ID}"
          mkdir -p /tmp/res && cp combined.jsonl summary.md hosts.txt /tmp/res/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin loadtest-results
          git checkout -B loadtest-results FETCH_HEAD
          mkdir -p "$dest" && cp /tmp/res/* "$dest/"
          cp /tmp/res/summary.md LATEST_LAYER.md
          git add "$dest" LATEST_LAYER.md
          git commit -m "shell-layer arm run ${GITHUB_RUN_ID} (${GITHUB_SHA::7})"
          git push origin loadtest-results
